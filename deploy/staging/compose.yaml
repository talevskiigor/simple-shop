name: forkids-staging

services:
  app:
    image: forkids-runtime:php8.3
    env_file: ./secrets/app.env
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./secrets/app.env:/var/www/html/.env:ro
      - ./media:/var/www/html/public/media/images:ro
      - ./cached-media:/var/www/html/public/cached-media
      - /run/mysqld/mysqld.sock:/run/mysqld/mysqld.sock
      - runtime:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped

volumes:
  runtime:
  bootstrap_cache:
