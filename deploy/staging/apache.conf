<VirtualHost *:80>
    ServerName forkids.tail.mk
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8086/
    ProxyPassReverse / http://127.0.0.1:8086/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set Cache-Control "private, no-store"
    ErrorLog ${APACHE_LOG_DIR}/forkids.tail.mk-error.log
    CustomLog ${APACHE_LOG_DIR}/forkids.tail.mk-access.log combined
</VirtualHost>
