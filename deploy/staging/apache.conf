<VirtualHost *:80>
    ServerName forkids.mk
    ServerAlias www.forkids.mk forkids.tail.mk

    # Keep old bank POST returns reachable; canonicalize browser navigation.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{HTTP_HOST} !^forkids\.mk(?::80)?$ [NC]
    RewriteRule ^ https://forkids.mk%{REQUEST_URI} [R=308,L,NE]
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8086/
    ProxyPassReverse / http://127.0.0.1:8086/
    RequestHeader set X-Forwarded-Proto "https"

    # Laravel controls indexing independently from 1-denar payment test mode.
    Header always set Cache-Control "private, no-store"
    ErrorLog ${APACHE_LOG_DIR}/forkids.tail.mk-error.log
    CustomLog ${APACHE_LOG_DIR}/forkids.tail.mk-access.log combined
</VirtualHost>
